@if (cart.notification(); as message) {
  <div class="cart-toast">
    <svg class="cart-toast__icon" viewBox="0 0 20 20" fill="currentColor">
      <path
        fill-rule="evenodd"
        d="M16.704 5.29a1 1 0 010 1.42l-7.5 7.5a1 1 0 01-1.42 0l-3.5-3.5a1 1 0 111.42-1.42L8.5 12.08l6.79-6.79a1 1 0 011.42 0z"
        clip-rule="evenodd"
      />
    </svg>
    <span>{{ message }}</span>
  </div>
}

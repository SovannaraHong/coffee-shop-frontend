<div
  class="flex items-center gap-2 overflow-x-auto pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
>
  <button
    type="button"
    (click)="select(ALL)"
    class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition-colors"
    [ngClass]="{
      'bg-emerald-600 text-white': activeCategory() === ALL,
      'bg-white text-slate-600 border border-slate-200': activeCategory() !== ALL,
    }"
  >
    All
  </button>

  @for (category of categories(); track category) {
    <button
      type="button"
      (click)="select(category)"
      class="shrink-0 rounded-full px-4 py-2 text-sm font-medium transition-colors"
      [ngClass]="{
        'bg-emerald-600 text-white': activeCategory() === category,
        'bg-white text-slate-600 border border-slate-200': activeCategory() !== category,
      }"
    >
      {{ category }}
    </button>
  }
</div>

<section class="py-4">
  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-base font-semibold text-slate-900">{{ title() }}</h3>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="scroll('left')"
        class="flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition-colors hover:bg-slate-50"
        aria-label="Scroll left"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button
        type="button"
        (click)="scroll('right')"
        class="flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition-colors hover:bg-slate-50"
        aria-label="Scroll right"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>

  <div
    #scrollTrack
    class="flex gap-4 overflow-x-auto scroll-smooth pb-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
  >
    @for (product of products(); track product.id) {
      <app-product-card
        [product]="product"
        [isFavorite]="isFavorite(product.id)"
        (toggleFavorite)="toggleFavorite.emit($event)"
        (addToCart)="addToCart.emit($event)"
      />
    }
  </div>
</section>

<div class="relative mx-auto w-full max-w-7xl px-4 group">
  <!-- ============================= -->
  <!-- SWIPER -->
  <!-- ============================= -->

  <div #swiperContainer class="swiper w-full overflow-hidden rounded-2xl py-2">
    <div class="swiper-wrapper">
      @for (card of cards; track card.title) {
        <div class="swiper-slide h-auto">
          <div
            class="relative aspect-[3/4] w-full overflow-hidden rounded-2xl shadow-md transition-all duration-300 hover:shadow-xl sm:h-[460px] sm:aspect-auto"
          >
            <!-- IMAGE -->
            <img
              [src]="card.imageUrl"
              [alt]="card.title"
              class="absolute inset-0 h-full w-full object-cover"
            />

            <!-- GRADIENT -->
            <div
              class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"
            ></div>

            <!-- CONTENT -->
            <div
              class="absolute bottom-0 left-0 right-0 flex flex-col items-start p-5 text-white md:p-6"
            >
              <h3 class="text-xl font-extrabold leading-snug md:text-2xl">
                {{ card.title }}
              </h3>

              <p class="mt-1 max-w-xs text-xs leading-relaxed text-white/85 md:text-sm">
                {{ card.subtitle }}
              </p>

              <button
                type="button"
                class="mt-3 inline-flex items-center gap-2 rounded-full bg-emerald-700 px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-white transition-colors hover:bg-emerald-800"
              >
                {{ card.ctaLabel }}

                <svg
                  class="h-4 w-4"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M5 12h14" stroke-linecap="round" />

                  <path d="m13 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- ============================= -->
  <!-- PREVIOUS BUTTON -->
  <!-- ============================= -->

  <button
    type="button"
    (click)="goPrev()"
    aria-label="Previous slide"
    class="absolute left-1 top-1/2 z-20 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/95 text-gray-800 shadow-lg transition-all duration-300 hover:bg-white md:opacity-0 md:group-hover:opacity-100"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- ============================= -->
  <!-- NEXT BUTTON -->
  <!-- ============================= -->

  <button
    type="button"
    (click)="goNext()"
    aria-label="Next slide"
    class="absolute right-1 top-1/2 z-20 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/95 text-gray-800 shadow-lg transition-all duration-300 hover:bg-white md:opacity-0 md:group-hover:opacity-100"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- ============================= -->
  <!-- PAGINATION -->
  <!-- ============================= -->

  <div class="mt-4 flex items-center justify-center gap-2">
    @for (card of cards; track card.title; let i = $index) {
      <button
        type="button"
        (click)="goToSlide(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)"
        class="h-2 cursor-pointer rounded-full transition-all duration-300"
        [class.w-7]="activeIndex() === i"
        [class.bg-emerald-700]="activeIndex() === i"
        [class.w-2]="activeIndex() !== i"
        [class.bg-gray-300]="activeIndex() !== i"
      ></button>
    }
  </div>
</div>

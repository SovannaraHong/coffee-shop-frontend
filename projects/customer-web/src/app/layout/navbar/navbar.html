<header class="w-full font-poppins fixed z-5000 bg-white border-b border-[#e3d9cf]">
  <!-- TOP ROW: left nav / center logo / right icons -->
  <div class="max-w-7xl mx-auto px-6 py-3 grid grid-cols-3 items-center gap-4">
    <!-- LEFT: Main nav links -->
    <nav class="flex items-center">
      <ul class="flex items-center gap-8 text-sm font-poppins font-semibold overflow-x-auto">
        @for (link of navLinks; track link.label) {
          <li class="shrink-0">
            <a
              [routerLink]="link.route"
              routerLinkActive="text-[#3f2a1d] border-b-2 border-[#3f2a1d]"
              [routerLinkActiveOptions]="{ exact: link.route === '/' }"
              class="cursor-pointer text-[#7a6a5e] transition-colors hover:text-[#3f2a1d] pb-1 block"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- CENTER: Logo -->
    <a href="/" class="flex items-center justify-center shrink-0">
      <img class="w-40" src="/assets/images/logo-text.webp" alt="Apsara Coffee & EATERY" />
    </a>

    <!-- RIGHT: Search + Icon nav -->
    <div class="flex items-center justify-end gap-6">
      <!-- Search bar -->
      <div
        class="hidden md:flex items-center gap-2 bg-[#faf6f0] border border-[#e3d9cf] rounded-full px-4 py-2 w-full max-w-xs"
      >
        <svg
          class="w-4 h-4 text-[#a97a5a] shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input
          type="text"
          placeholder="Search coffee and more"
          class="bg-transparent text-sm text-[#3f2a1d] placeholder:text-[#a89484] outline-none w-full"
        />
      </div>

      <!-- Account -->
      @if (currentUser(); as user) {
        <div class="relative">
          <button
            (click)="toggleMenu()"
            class="flex flex-col items-center gap-1 text-[#7a6a5e] hover:text-[#3f2a1d] transition-colors"
          >
            @if (user.avatarUrl) {
              <img
                [src]="user.avatarUrl"
                [alt]="displayName"
                class="w-5 h-5 rounded-full object-cover"
              />
            } @else {
              <span
                class="w-5 h-5 rounded-full bg-[#3f2a1d] text-white text-[9px] font-bold flex items-center justify-center"
              >
                {{ initial }}
              </span>
            }
            <span class="text-xs font-medium">{{ displayName }}</span>
          </button>

          @if (isMenuOpen()) {
            <div
              class="absolute right-0 mt-2 w-52 bg-white rounded-xl shadow-[0_10px_30px_-8px_rgba(0,0,0,0.2)] border border-[#eee6da] py-2 z-50"
            >
              @for (item of userMenuItems; track item.label) {
                <button
                  (click)="onMenuAction(item.action)"
                  class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-[#3f2a1d] hover:bg-[#faf6f0] transition-colors text-left"
                >
                  @switch (item.icon) {
                    @case ('user') {
                      <svg
                        class="w-4 h-4 text-[#a97a5a]"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                      </svg>
                    }
                    @case ('bag') {
                      <svg
                        class="w-4 h-4 text-[#a97a5a]"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                        <path d="M3 6h18" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                      </svg>
                    }
                    @case ('heart') {
                      <svg
                        class="w-4 h-4 text-[#a97a5a]"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"
                        />
                      </svg>
                    }
                  }
                  {{ item.label }}
                </button>
              }
              <div class="my-1.5 border-t border-[#eee6da]"></div>
              <button
                (click)="onSignOut()"
                class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-[#b3443c] hover:bg-[#fdf2f1] transition-colors text-left"
              >
                <svg
                  class="w-4 h-4"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <path d="M16 17l5-5-5-5" />
                  <path d="M21 12H9" />
                </svg>
                Sign Out
              </button>
            </div>
          }
        </div>
      } @else {
        <a
          routerLink="front/login"
          class="flex flex-col items-center gap-1 text-[#7a6a5e] hover:text-[#3f2a1d] transition-colors"
        >
          <svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="text-xs font-medium">Account</span>
        </a>
      }

      <!-- Orders -->
      <button
        type="button"
        (click)="ordersService.open()"
        class="flex flex-col items-center gap-1 text-[#7a6a5e] hover:text-[#3f2a1d] transition-colors"
      >
        <i class="fa-regular fa-clock"></i>

        <span class="text-xs font-medium">Orders</span>
      </button>

      <!-- Favorites -->
      <a
        routerLink="/favorites"
        class="flex flex-col items-center gap-1 text-[#7a6a5e] hover:text-[#3f2a1d] transition-colors"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"
          />
        </svg>
        <span class="text-xs font-medium">Favorite</span>
      </a>

      <!-- Cart -->
      <button
        type="button"
        (click)="cartService.open()"
        class="flex flex-col items-center gap-1 text-[#7a6a5e] hover:text-[#3f2a1d] transition-colors"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path d="M3 6h18" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        <span class="text-xs font-medium">Cart</span>
      </button>
    </div>
  </div>

  <!-- SECOND ROW: category nav -->
  <nav class="bg-[#faf6f0] border-t border-[#e3d9cf]">
    <div class="max-w-7xl mx-auto px-6">
      <ul
        class="flex items-center justify-center gap-10 text-sm font-poppins font-semibold py-2.5 overflow-x-auto"
      >
        @for (link of categoryLinks; track link.label) {
          <li class="shrink-0">
            <a
              [routerLink]="link.route"
              routerLinkActive="text-[#3f2a1d] border-b-2 border-[#3f2a1d]"
              class="cursor-pointer text-[#7a6a5e] transition-colors hover:text-[#3f2a1d] pb-1 block"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>

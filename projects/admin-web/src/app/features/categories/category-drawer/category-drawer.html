@if (mounted()) {
  <div class="fixed inset-0 z-[100]" [class.pointer-events-none]="!open()">
    <!-- Backdrop -->
    <div
      class="absolute inset-0 bg-neutral-900/40 backdrop-blur-[2px] transition-opacity duration-300"
      [class]="shown() ? 'opacity-100' : 'opacity-0'"
      (click)="closed.emit()"
    ></div>

    <!-- Panel: pinned right, slides in from right to left -->
    <aside
      class="absolute right-0 top-0 flex h-full flex-col bg-white shadow-2xl"
      style="
        width: min(720px, 100vw);
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 350ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 350ms;
      "
      [style.transform]="shown() ? 'translateX(0)' : 'translateX(100%)'"
      [style.visibility]="shown() ? 'visible' : 'hidden'"
      role="dialog"
      aria-modal="true"
      aria-label="Category form"
    >
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-neutral-200 px-8 py-5">
        <div>
          <h2 class="text-xl font-medium text-neutral-900">
            {{ category() ? 'Edit category' : 'Add category' }}
          </h2>
          <p class="mt-0.5 text-sm text-neutral-500">
            Group your menu items so they're easy to find
          </p>
        </div>
        <button
          type="button"
          class="grid size-9 place-items-center rounded-lg bg-neutral-100 text-neutral-600 transition hover:bg-neutral-200"
          aria-label="Close"
          (click)="closed.emit()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Body -->
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
        id="categoryForm"
        class="flex-1 space-y-6 overflow-y-auto px-8 py-6"
      >
        <!-- Image -->
        <div>
          <span class="mb-1.5 block text-sm font-medium text-neutral-700">Category image</span>
          <label
            class="group relative flex h-56 cursor-pointer items-center justify-center overflow-hidden rounded-xl border-2 border-dashed border-neutral-300 text-center transition-colors hover:border-[#e95f37] hover:bg-orange-50/40"
          >
            @if (imagePreview) {
              <img
                [src]="imagePreview"
                alt="Preview"
                class="absolute inset-0 size-full object-cover"
              />
              <span
                class="absolute inset-0 grid place-items-center bg-neutral-900/0 text-sm font-medium text-white opacity-0 transition group-hover:bg-neutral-900/40 group-hover:opacity-100"
              >
                <span><i class="fa-solid fa-camera mr-1.5"></i>Click to change</span>
              </span>
              <button
                type="button"
                aria-label="Remove image"
                class="absolute right-3 top-3 grid size-8 place-items-center rounded-full bg-white/90 text-red-500 shadow transition hover:bg-white"
                (click)="removeImage($event)"
              >
                <i class="fa-regular fa-trash-can text-sm"></i>
              </button>
            } @else {
              <span class="text-sm text-neutral-500">
                <span
                  class="mx-auto mb-2 grid size-12 place-items-center rounded-full bg-neutral-100 text-xl text-neutral-400"
                  ><i class="fa-regular fa-image"></i
                ></span>
                <span class="block font-medium text-neutral-800">Click to upload an image</span>
                <span class="text-xs text-neutral-400">PNG or JPG, up to 2 MB</span>
              </span>
            }
            <input type="file" accept="image/*" class="sr-only" (change)="onImage($event)" />
          </label>
        </div>

        <!-- Name -->
        <div>
          <label for="c-name" class="mb-1.5 block text-sm font-medium text-neutral-700">Name</label>
          <input
            id="c-name"
            formControlName="name"
            placeholder="e.g. Ice"
            class="h-[42px] w-full rounded-md border border-neutral-200 px-3.5 text-[15px] outline-none placeholder:text-neutral-400 focus:border-[#e95f37]"
          />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <p class="mt-1 text-xs text-red-500">Name is required.</p>
          }
        </div>

        <!-- Description -->
        <div>
          <label for="c-desc" class="mb-1.5 block text-sm font-medium text-neutral-700"
            >Description</label
          >
          <textarea
            id="c-desc"
            rows="4"
            formControlName="description"
            placeholder="e.g. Tea-based drinks"
            class="w-full rounded-md border border-neutral-200 px-3.5 py-2.5 text-[15px] outline-none placeholder:text-neutral-400 focus:border-[#e95f37]"
          ></textarea>
        </div>

        <!-- Active switch -->
        <label
          class="flex cursor-pointer items-center justify-between rounded-xl border border-neutral-200 px-4 py-3.5"
        >
          <span>
            <span class="block text-sm font-medium text-neutral-900">Active</span>
            <span class="text-xs text-neutral-500">Visible on the menu</span>
          </span>
          <input type="checkbox" formControlName="isActive" class="peer sr-only" />
          <span
            class="relative h-6 w-11 shrink-0 rounded-full bg-neutral-300 transition-colors after:absolute after:left-0.5 after:top-0.5 after:size-5 after:rounded-full after:bg-white after:shadow after:transition-transform peer-checked:bg-[#e95f37] peer-checked:after:translate-x-5"
          ></span>
        </label>
      </form>

      <!-- Footer -->
      <div class="flex gap-3 border-t border-neutral-200 px-8 py-4">
        <button
          type="button"
          class="h-[42px] flex-1 rounded-md border border-neutral-700 bg-white text-[15px] text-neutral-700 hover:bg-neutral-50"
          (click)="closed.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          form="categoryForm"
          class="h-[42px] flex-1 rounded-md bg-[#e95f37] text-[15px] text-white hover:bg-[#d4532e]"
        >
          <i class="fa-solid fa-check mr-1.5 text-xs"></i
          >{{ category() ? 'Save changes' : 'Add category' }}
        </button>
      </div>
    </aside>
  </div>
}

<app-page-header title="Staff" subtitle="Your team, their roles and shifts">
  <button type="button" class="btn btn-primary" (click)="openAdd()">
    <i class="fa-solid fa-user-plus"></i> Add staff
  </button>
</app-page-header>

<div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
  <div class="flex gap-1 overflow-x-auto">
    @for (r of ['all'].concat(roles); track r) {
      <button
        type="button"
        class="inline-flex items-center gap-2 whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-medium capitalize transition-colors"
        [class]="
          role() === r
            ? 'bg-primary text-white'
            : 'bg-white text-neutral-600 border border-neutral-200 hover:bg-neutral-100'
        "
        (click)="role.set(r)"
      >
        {{ r === 'all' ? 'Everyone' : r }}
        <span
          class="rounded-full px-1.5 text-xs"
          [class]="role() === r ? 'bg-white/25' : 'bg-neutral-100 text-neutral-500'"
          >{{ roleCount(r) }}</span
        >
      </button>
    }
  </div>
  <div class="relative md:w-64">
    <i
      class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-neutral-400"
    ></i>
    <input
      type="search"
      class="input pl-9"
      placeholder="Search staff…"
      [value]="search()"
      (input)="search.set($any($event.target).value)"
    />
  </div>
</div>

<div class="card overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full min-w-[860px] text-left text-sm">
      <thead class="border-b border-neutral-200 bg-neutral-50 text-xs font-medium text-neutral-500">
        <tr>
          <th class="px-5 py-3">Staff member</th>
          <th class="px-5 py-3">Role</th>
          <th class="px-5 py-3">Contact</th>
          <th class="px-5 py-3">Shift</th>
          <th class="px-5 py-3">Joined</th>
          <th class="px-5 py-3">Status</th>
          <th class="px-5 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-neutral-100">
        @for (s of filtered(); track s.id) {
          <tr class="transition-colors hover:bg-neutral-50">
            <td class="px-5 py-3">
              <div class="flex items-center gap-3">
                <img [src]="s.avatar" [alt]="s.name" class="size-10 rounded-full object-cover" />
                <span class="font-medium text-neutral-900">{{ s.name }}</span>
              </div>
            </td>
            <td class="px-5 py-3 text-primary">{{ s.role }}</td>
            <td class="px-5 py-3 text-neutral-600">
              <div class="flex items-center gap-2">
                <i class="fa-regular fa-envelope w-4 text-neutral-400"></i>{{ s.email }}
              </div>
              <div class="mt-0.5 flex items-center gap-2">
                <i class="fa-solid fa-phone w-4 text-neutral-400"></i>{{ s.phone || '—' }}
              </div>
            </td>
            <td class="px-5 py-3 text-neutral-600">{{ s.shift }}</td>
            <td class="whitespace-nowrap px-5 py-3 text-neutral-600">
              {{ s.joinedAt | date: 'MMM d, y' }}
            </td>
            <td class="px-5 py-3"><app-status-badge [status]="s.status" /></td>
            <td class="px-5 py-3">
              <div class="flex justify-end gap-1">
                <button
                  type="button"
                  class="btn btn-icon btn-sm btn-light"
                  aria-label="Edit"
                  (click)="openEdit(s)"
                >
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button
                  type="button"
                  class="btn btn-icon btn-sm bg-red-50 text-red-600 hover:bg-red-100"
                  aria-label="Delete"
                  (click)="toDelete.set(s)"
                >
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="7" class="p-12 text-center text-neutral-400">
              <i class="fa-solid fa-users mb-2 block text-3xl"></i>No staff found
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-staff-drawer
  [open]="showForm()"
  [staff]="editing()"
  (closed)="showForm.set(false)"
  (saved)="save($event)"
/>

<app-confirm-dialog
  [open]="!!toDelete()"
  title="Remove staff member"
  [message]="'Remove ' + toDelete()?.name + ' from the team?'"
  confirmLabel="Remove"
  (confirmed)="confirmDelete()"
  (cancelled)="toDelete.set(null)"
/>

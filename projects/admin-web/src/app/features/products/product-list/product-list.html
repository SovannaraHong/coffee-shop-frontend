<!-- Header -->
<div class="mb-6 flex items-start justify-between">
  <div>
    <h1 class="text-[28px] font-normal leading-tight text-neutral-900">Products</h1>
    <p class="mt-1 text-[15px] text-neutral-900">Manage your menu items and prices</p>
  </div>
  <div class="flex gap-2">
    <button
      type="button"
      class="flex h-[42px] items-center gap-1.5 rounded-md border border-neutral-700 bg-white px-4 text-[15px] text-neutral-700 hover:bg-neutral-50"
    >
      <i class="fa-regular fa-file-excel text-xs text-emerald-600"></i> Excel
    </button>
    <button
      type="button"
      class="flex h-[42px] items-center gap-1.5 rounded-md border border-neutral-700 bg-white px-4 text-[15px] text-neutral-700 hover:bg-neutral-50"
    >
      <i class="fa-regular fa-file-pdf text-xs text-red-500"></i> PDF
    </button>
    <button
      type="button"
      class="flex h-[42px] items-center gap-1.5 rounded-md bg-[#e95f37] px-4 text-[15px] text-white hover:bg-[#d4532e]"
      (click)="openAdd()"
    >
      <i class="fa-solid fa-plus text-xs"></i> Add product
    </button>
  </div>
</div>

<!-- Table card -->
<div class="overflow-hidden rounded-2xl border border-neutral-200 bg-white">
  <div
    class="flex flex-col gap-3 border-b border-neutral-200 p-4 xl:flex-row xl:items-center xl:justify-between"
  >
    <!-- Availability tabs -->
    <div class="inline-flex rounded-xl bg-neutral-100 p-1 text-sm">
      @for (t of availabilityTabs; track t.value) {
        <button
          type="button"
          class="rounded-lg px-3.5 py-1.5 font-medium transition-colors"
          [class]="
            availability() === t.value
              ? 'bg-white text-neutral-900 shadow-sm'
              : 'text-neutral-500 hover:text-neutral-700'
          "
          (click)="setAvailability(t.value)"
        >
          {{ t.label }}
        </button>
      }
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
      <select
        class="h-[38px] rounded-full border border-neutral-200 bg-white px-4 text-sm text-neutral-700 outline-none focus:border-[#e95f37]"
        aria-label="Category"
        (change)="setCategory($any($event.target).value)"
      >
        <option value="0">All categories</option>
        @for (c of categories(); track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
        }
      </select>
      <div class="relative sm:w-64">
        <i
          class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-neutral-400"
        ></i>
        <input
          type="search"
          placeholder="Search name or SKU…"
          class="h-[38px] w-full rounded-full border border-neutral-200 bg-white pl-9 pr-4 text-sm outline-none placeholder:text-neutral-400 focus:border-[#e95f37]"
          [value]="search()"
          (input)="setSearch($any($event.target).value)"
        />
      </div>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-[15px]">
      <thead>
        <tr class="h-[42px] bg-[#f7f7f7] text-xs uppercase tracking-wide text-neutral-500">
          <th class="px-5 font-medium">Product</th>
          <th class="font-medium">Category</th>
          <th class="font-medium">Sizes</th>
          <th class="font-medium">Cost</th>
          <th class="font-medium">Price</th>
          <th class="font-medium">Margin</th>
          <th class="font-medium">Status</th>
          <th class="px-5 text-right font-medium">Actions</th>
        </tr>
      </thead>

    </table>
  </div>

  <!-- Footer / pagination -->
  <div class="flex items-center justify-between border-t border-neutral-200 px-5 py-3">
    <span class="text-sm text-neutral-500"
      >Showing {{ paged().length }} of {{ filtered().length }} products</span
    >
    <div class="flex overflow-hidden rounded-md border border-neutral-200 text-[15px]">
      <button
        type="button"
        class="bg-neutral-200 px-3.5 py-1.5 text-neutral-600"
        [disabled]="page() === 1"
        (click)="goTo(page() - 1)"
      >
        Previous
      </button>
      @for (n of pages(); track n) {
        <button
          type="button"
          class="border-l border-neutral-200 px-3.5 py-1.5"
          [class]="
            n === page()
              ? 'bg-[#e95f37] text-white'
              : 'bg-white text-neutral-700 hover:bg-neutral-100'
          "
          (click)="goTo(n)"
        >
          {{ n }}
        </button>
      }
      <button
        type="button"
        class="border-l border-neutral-200 bg-white px-3.5 py-1.5 text-neutral-700 hover:bg-neutral-100"
        [disabled]="page() === pageCount()"
        (click)="goTo(page() + 1)"
      >
        Next
      </button>
    </div>
  </div>
</div>

<app-product-drawer
  [open]="showDrawer()"
  [product]="editing()"
  [categories]="categories()"
  (closed)="showDrawer.set(false)"
  (saved)="onSaved($event)"
/>

<app-confirm-dialog
  [open]="!!toDelete()"
  title="Delete product"
  [message]="'Are you sure you want to delete ' + toDelete()?.name + '? This cannot be undone.'"
  (confirmed)="confirmDelete()"
  (cancelled)="toDelete.set(null)"
/>
